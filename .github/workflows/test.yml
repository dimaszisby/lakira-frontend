name: frontend-ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs run side by side. "CI passed" at the end is the one check that says the whole run
# passed (kit ci-in-parallel, ADR-0036). They used to be a chain, checks then unit, integration,
# build and e2e, which took 12 to 14 minutes for 2 to 3 minutes of work: each job installs its
# dependencies afresh. E2E builds the app itself rather than waiting on a build job, so the
# slowest job pays one install, not two (kit build-inside-e2e, ADR-0038).
jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Cypress's postinstall downloads its binary unless told not to, and nothing in this job runs
    # Cypress. Typecheck needs only the npm package's bundled types. E2E, which runs Cypress,
    # downloads it (kit ci-in-parallel; its cache measured no gain, kit build-inside-e2e).
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run CSS lint
        run: npm run lint:css

      - name: Run typecheck
        run: npm run typecheck

      # Last of the four deliberately: a formatting failure is auto-fixable and
      # says nothing about correctness, so it must not mask a lint or type error
      # in the same run. Steps are serial and stop at the first failure.
      - name: Run format check
        run: npm run format

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Runs no Cypress, so `npm ci` skips its binary download (see Static checks).
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:ci

      # Reuses the coverage/ output the step above produces; no second test run.
      # Global thresholds are enforced by jest itself in test:unit:ci; this adds
      # the per-folder goals in coverage-goals.json.
      - name: Check per-folder coverage goals
        run: npm run coverage:check

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Runs no Cypress, so `npm ci` skips its binary download (see Static checks).
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E tests
    runs-on: ubuntu-26.04
    # Builds the app itself, so it needs no other job and pays one `npm ci` (ADR-0038).
    timeout-minutes: 30
    env:
      CYPRESS_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cypress's postinstall downloads its binary here. A cache of ~/.cache/Cypress hit and the
      # install still took 1m45s, so there is none (kit build-inside-e2e).
      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start Next.js app
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid

      - name: Wait for app readiness
        run: |
          for i in {1..60}; do
            if curl -fsS "$CYPRESS_BASE_URL" >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done

          echo "App failed to start in time"
          tail -n 200 /tmp/next-start.log || true
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e:public

      # Its own step so that an accessibility failure is named as one in the
      # run. The signed-in pages are not checked here: that needs the backend
      # (kit cypress-a11y-e2e, D-01).
      - name: Run accessibility checks on the public pages (axe, WCAG 2.1 A and AA)
        run: npm run test:e2e:a11y

      # Cypress strips Content-Security-Policy headers in the run above, so it
      # would pass with a policy that blocked the whole app. This run keeps
      # script-src and lets the browser enforce it (ADR-0026).
      - name: Run E2E tests with the Content Security Policy enforced
        run: npm run test:e2e:csp

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/next-start.pid ]; then
            kill "$(cat /tmp/next-start.pid)" || true
            rm -f /tmp/next-start.pid
          fi

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: warn

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: warn

  api-contract:
    name: API Contract Drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Runs no Cypress, so `npm ci` skips its binary download (see Static checks).
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when lakira-backend has shipped a contract change that this repo
      # has not picked up. Fix with: npm run api:spec:sync && npm run api:types:generate
      - name: Check OpenAPI snapshot against backend
        run: npm run api:spec:check

      - name: Check generated types against snapshot
        run: npm run api:types:check

  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Runs no Cypress, so `npm ci` skips its binary download (see Static checks).
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only; the full audit runs nightly in dependency-audit.yml (ADR-0023).
      - name: Run lint + npm audit (production dependencies)
        run: npm run security:scan

  # Full-history gitleaks scan on every push and PR. Runs a pinned,
  # checksum-verified gitleaks binary rather than a third-party action, so no
  # action code runs with this job's token. See .claude/rules/security.md.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, matching the release's
      # published checksums. Hard-coded on purpose: fetching the checksum at run
      # time would verify nothing the release itself could not change.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner'

  # The one check that says the whole run passed: every job above, each a success. The `dev`
  # ruleset requires it by name, so a rename must change `.github/rulesets/dev.json` (ADR-0039).
  # `if: always()` is what makes it trustworthy: without it a failed job leaves this one skipped,
  # and GitHub counts a skipped required check as passing. A skipped or cancelled job fails it too
  # (ADR-0036).
  ci:
    name: CI passed
    runs-on: ubuntu-26.04
    needs: [checks, unit, integration, e2e, api-contract, security, secret-scan]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
