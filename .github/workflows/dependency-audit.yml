name: dependency-audit

# Audits every dependency, development tooling included. Pull requests audit production
# dependencies only (the `security` job in test.yml), so an advisory in lint, test or build
# tooling surfaces here instead of failing unrelated work. See ADR-0023.
#
# GitHub sends a failed scheduled run to the user who last modified the cron line below.
# GitHub also disables schedules in a public repo after 60 days without activity, so a green
# manual run proves the job works, not that the schedule is still alive.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  # A manual run on dev shares this group with the nightly one; never cancel an audit mid-run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Full dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # npm audit reads package-lock.json; it needs no install, so no package code runs here.
      - name: Run npm audit (all dependencies)
        run: npm run security:audit:full
