# Keeps the SHA-pinned actions in .github/workflows/ current. Every `uses:` is pinned to a full
# commit SHA with the version as a trailing comment; Dependabot updates both together.
# npm is deliberately not listed here: dependency bumps stay a manual decision for now.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
